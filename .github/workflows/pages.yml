name: Pages

# Publishes site/ to GitHub Pages:
# https://htpdevs.github.io/birthmark/privacy-policy/ is the privacy policy URL
# and https://htpdevs.github.io/birthmark/support/ is the support URL for the
# Play Console and App Store Connect. site/privacy-policy/index.html is
# generated from src/legal/privacyPolicy.ts and site/support/index.html from
# src/legal/supportPageHtml.ts; tests/privacyPolicy.test.ts and
# tests/supportPage.test.ts (run by ci.yml on every PR) fail if they drift.

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
